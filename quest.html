<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English Quest · Design by Yaron Y</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="English Quest – משחק שלבים באנגלית לכיתות ג׳–ד׳. Design by Yaron Y">
<meta name="author" content="Yaron Y">
<meta property="og:title" content="English Quest · Design by Yaron Y">
<meta property="og:description" content="24 שלבים, נקודות, כוכבים ותחרות בין חברים – לומדים אנגלית בכיף">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Varela+Round&display=swap">
<style>
/* Layout: one-column adventure map. Sticky player bar on top, one screen at a time below (map, level, result, leaderboard). */
:root{
  --bg:#EAF4FA;--paper:#FFFFFF;--ink:#1E2A44;--muted:#5B6782;--line:#CFE0EC;
  --tomato:#F2603F;--sun:#FFC23D;--grass:#2FA36B;--berry:#8C5BD6;--sky:#3B86D9;
  --good-bg:#DDF5E8;--bad-bg:#FDE3DC;--lock:#B8C6D6;
  --shadow:0 3px 0 rgba(30,42,68,.12);
  --f-display:"Fredoka","Varela Round",system-ui,sans-serif;
  --f-body:"Varela Round","Fredoka",system-ui,"Arial Hebrew",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13202E;--paper:#1C2C3E;--ink:#EAF1F8;--muted:#A3B3C6;--line:#2C4157;
  --tomato:#FF7A5C;--sun:#FFCD5C;--grass:#46C186;--berry:#A783EA;--sky:#5FA2EC;
  --good-bg:#1D4433;--bad-bg:#4A2A24;--lock:#3A4E64;--shadow:0 3px 0 rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13202E;--paper:#1C2C3E;--ink:#EAF1F8;--muted:#A3B3C6;--line:#2C4157;
  --tomato:#FF7A5C;--sun:#FFCD5C;--grass:#46C186;--berry:#A783EA;--sky:#5FA2EC;
  --good-bg:#1D4433;--bad-bg:#4A2A24;--lock:#3A4E64;--shadow:0 3px 0 rgba(0,0,0,.35);color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;
  background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 34px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
.en{font-family:var(--f-display);direction:ltr;unicode-bidi:isolate}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
h2{font-family:var(--f-display);font-size:24px;margin:0 0 10px;text-wrap:balance}
h3{margin:0;text-wrap:balance}
.muted{color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{background:var(--paper);border-radius:22px;padding:16px;box-shadow:var(--shadow)}
.btn{border:none;border-radius:999px;padding:11px 20px;font-size:17px;font-weight:600;background:var(--grass);color:#fff;box-shadow:var(--shadow)}
.btn.big{font-size:20px;padding:14px 26px}
.btn.alt{background:var(--sky)}.btn.warm{background:var(--tomato)}
.btn.ghost{background:var(--paper);color:var(--ink);border:2px solid var(--line)}
.btn:active,.say:active{transform:translateY(2px);box-shadow:none}
.btn:disabled{opacity:.5}
.say{border:none;background:var(--sky);color:#fff;border-radius:999px;padding:8px 14px;font-size:16px;box-shadow:var(--shadow)}

/* Header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 8px;display:flex;align-items:center;gap:10px}
.brand{flex:1;min-width:0;font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1;color:var(--tomato)}
.brand small{display:block;font-family:var(--f-body);font-weight:400;font-size:12px;color:var(--muted);margin-top:3px}
.chip{display:flex;align-items:center;gap:6px;background:var(--paper);border:2px solid var(--sun);border-radius:999px;padding:4px 12px;font-family:var(--f-display);font-weight:600;font-size:17px;white-space:nowrap}
.chip .av{font-size:20px;line-height:1}

/* Profiles */
.profiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.pcard{background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:var(--shadow)}
.pcard .av{font-size:44px;line-height:1.1}
.pcard b{font-size:19px;overflow-wrap:anywhere;text-align:center}
.pcard small{color:var(--muted);font-size:14px}
.form{display:flex;flex-direction:column;gap:12px}
.form label{font-weight:600}
input[type=text],textarea{font:inherit;width:100%;border:2px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--bg);color:var(--ink)}
textarea{min-height:84px;resize:vertical;font-size:15px}
.seg{display:flex;gap:8px}
.seg button,.avs button{border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:8px 18px;font-weight:600}
.seg button[aria-pressed="true"],.avs button[aria-pressed="true"]{border-color:var(--tomato);background:var(--bad-bg)}
.avs{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.avs button{font-size:28px;padding:6px 0;line-height:1.2}

/* Map */
.hero{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;margin-bottom:14px}
.hero .av{font-size:58px;line-height:1}
.hero .rank{color:var(--berry);font-weight:600;font-size:15px}
.hero .name{font-family:var(--f-display);font-size:26px;font-weight:700;line-height:1.1;overflow-wrap:anywhere}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;grid-column:1/-1}
.stat{background:var(--bg);border-radius:14px;padding:8px 4px;text-align:center;min-width:0}
.stat b{display:block;font-family:var(--f-display);font-size:22px;line-height:1.2;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.actions .btn{flex:1 1 auto}
.world{margin-bottom:18px;border-radius:24px;padding:14px 14px 18px;background:var(--paper);box-shadow:var(--shadow);border-top:8px solid var(--c)}
.world.locked{opacity:.75}
.whead{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.whead .e{font-size:30px}
.whead h3{font-family:var(--f-display);font-size:21px;flex:1;min-width:0}
.whead .ws{font-size:14px;color:var(--muted);white-space:nowrap}
.path{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;align-items:start}
.node{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:none;padding:4px 0;min-width:0}
.node:nth-child(even){margin-top:22px}
.node .ball{width:62px;height:62px;max-width:100%;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:700;font-size:26px;background:var(--c);color:#fff;box-shadow:0 4px 0 rgba(30,42,68,.2);position:relative}
.node.lock .ball{background:var(--lock);color:var(--muted);font-size:22px}
.node.now .ball{outline:4px solid var(--sun);outline-offset:3px;animation:pulse 1.6s ease-in-out infinite}
.node.boss .ball{width:70px;height:70px}
.node .t{font-size:12.5px;line-height:1.25;text-align:center;color:var(--muted);min-height:2.5em}
.node .stars{font-size:14px;letter-spacing:1px;color:var(--sun);min-height:1.3em}
.node .stars .off{color:var(--lock)}
.pro{font-size:11px;position:absolute;top:-6px;inset-inline-end:-6px;background:var(--sun);color:#1E2A44;border-radius:999px;padding:1px 6px}

/* Play */
.play{background:var(--paper);border-radius:22px;padding:14px 16px 16px;box-shadow:var(--shadow)}
.phead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.phead .x{border:2px solid var(--line);background:var(--bg);border-radius:999px;width:38px;height:38px;font-size:16px}
.phead .lt{flex:1;min-width:0;font-weight:600;font-size:15px}
.hearts{font-size:20px;letter-spacing:2px;white-space:nowrap}
.pts{font-family:var(--f-display);font-weight:700;color:var(--berry);font-size:20px;font-variant-numeric:tabular-nums;white-space:nowrap}
.dots{display:flex;gap:4px;margin-top:10px}
.dots i{flex:1;height:8px;border-radius:999px;background:var(--line)}
.dots i.ok{background:var(--grass)}.dots i.no{background:var(--tomato)}.dots i.now{background:var(--sky)}
.timer{height:10px;border-radius:999px;background:var(--line);margin-top:8px;overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:var(--sun);border-radius:999px;transform-origin:right;transition:background .3s}
.timer i.low{background:var(--tomato)}
.prompt{text-align:center;padding-block:14px 10px;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.prompt .q{font-size:20px;font-weight:600}
.prompt .pic{font-size:52px;line-height:1.1}
.prompt .hint{color:var(--muted);font-size:17px}
.prompt .bigq{font-family:var(--f-display);font-weight:700;font-size:58px;line-height:1.1;direction:ltr;color:var(--tomato);overflow-wrap:anywhere}
.prompt .sent{font-family:var(--f-display);font-weight:600;font-size:30px;line-height:1.25;direction:ltr;overflow-wrap:anywhere}
.prompt .sent u{text-decoration:none;display:inline-block;min-width:2.6em;border-bottom:4px solid var(--tomato);color:var(--tomato)}
.swbig{width:96px;height:96px;border-radius:50%;background:var(--sw);border:3px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:42px}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.opts.n3{grid-template-columns:1fr}
.opts.n6{grid-template-columns:repeat(2,1fr)}
.opt{border:3px solid var(--line);background:var(--bg);border-radius:18px;padding:12px 8px;font-family:var(--f-display);font-weight:600;font-size:28px;direction:ltr;min-height:64px;overflow-wrap:anywhere}
.opts.n6 .opt{font-size:24px;min-height:58px}
.opt.he{font-family:var(--f-body);direction:rtl;font-size:21px}
.opt.sw{background:var(--sw);min-height:76px}
.opt.right{border-color:var(--grass);background:var(--good-bg)}
.opt.wrong{border-color:var(--tomato);background:var(--bad-bg);animation:shake .35s}
.opt.sw.right{background:var(--sw);box-shadow:0 0 0 4px var(--grass)}
.opt.sw.wrong{background:var(--sw);box-shadow:0 0 0 4px var(--tomato)}
.opt:disabled{cursor:default}
.slots{display:flex;gap:6px;justify-content:center;direction:ltr;flex-wrap:wrap;margin-bottom:12px}
.slots button{width:46px;height:54px;border-radius:12px;border:3px dashed var(--line);background:var(--bg);font-family:var(--f-display);font-weight:700;font-size:28px}
.slots button.full{border-style:solid;border-color:var(--sky)}
.slots.right button{border-color:var(--grass);background:var(--good-bg)}
.slots.wrong button{border-color:var(--tomato);background:var(--bad-bg)}
.tiles{display:flex;gap:8px;justify-content:center;direction:ltr;flex-wrap:wrap}
.tiles button{width:50px;height:54px;border-radius:12px;border:2px solid var(--line);background:var(--paper);box-shadow:var(--shadow);font-family:var(--f-display);font-weight:700;font-size:28px}
.tiles button:disabled{visibility:hidden}
.feedback{min-height:34px;text-align:center;font-weight:600;margin-top:12px;font-size:19px}
.feedback.ok{color:var(--grass)}.feedback.no{color:var(--tomato)}
.foot{display:flex;justify-content:center;margin-top:6px;min-height:48px}

/* Result */
.result{text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.result .bigst{font-size:46px;letter-spacing:6px;color:var(--sun)}
.result .bigst .off{color:var(--lock)}
.result .gain{font-family:var(--f-display);font-size:48px;font-weight:700;color:var(--berry);line-height:1}
.result table{border-collapse:collapse;font-size:15px;margin-block:4px}
.result td{padding:3px 10px}
.result td:last-child{font-variant-numeric:tabular-nums;font-weight:600;text-align:left}
.result .row{justify-content:center}
.news{background:var(--good-bg);border-radius:14px;padding:8px 14px;font-weight:600}

/* Leaderboard */
.board{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.brow{display:grid;grid-template-columns:34px 40px 1fr auto auto;gap:8px;align-items:center;background:var(--paper);border-radius:16px;padding:10px 12px;box-shadow:var(--shadow)}
.brow.me{outline:3px solid var(--sun)}
.brow .pl{font-family:var(--f-display);font-weight:700;font-size:20px;text-align:center}
.brow .av{font-size:30px;text-align:center}
.brow .nm{min-width:0}
.brow .nm b{display:block;overflow-wrap:anywhere;line-height:1.2}
.brow .nm small{color:var(--muted);font-size:13px}
.brow .lv{text-align:center;font-family:var(--f-display);line-height:1.1}
.brow .lv b{display:block;font-size:22px;color:var(--tomato)}
.brow .lv small{font-size:12px;color:var(--muted)}
.brow .del{border:none;background:none;color:var(--muted);font-size:16px;padding:4px}
.codebox{font-size:14px;direction:rtl;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bg);border-radius:12px;padding:10px;user-select:all}
.msg{font-weight:600;min-height:1.5em}
.msg:empty{display:none}
.msg.ok{color:var(--grass)}.msg.no{color:var(--tomato)}

/* Paywall */
.sheet{position:fixed;inset:0;background:rgba(15,25,40,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom,0px))}
.sheet .card{width:100%;max-width:460px;display:flex;flex-direction:column;gap:10px}
.sheet ul{margin:0;padding-inline-start:20px}

.credit{margin-top:28px;text-align:center;color:var(--muted);font-size:13px}
.notice{background:var(--bad-bg);border-radius:14px;padding:10px 14px;margin-bottom:14px;font-size:15px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.confetti i{position:absolute;top:-40px;font-style:normal;font-size:26px;animation:fall 1.8s ease-in forwards}

@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes fall{to{transform:translateY(110vh) rotate(300deg)}}
@media (prefers-reduced-motion: reduce){.opt.wrong,.node.now .ball{animation:none}.confetti{display:none}}
@media (max-width:420px){
  .brand{font-size:22px}
  .node .ball{width:54px;height:54px;font-size:22px}
  .node.boss .ball{width:60px;height:60px}
  .prompt .bigq{font-size:48px}
  .opt{font-size:24px}
  .brow{grid-template-columns:28px 32px 1fr auto auto;gap:6px;padding:8px}
  .brow .av{font-size:24px}
  .slots button{width:40px;height:50px;font-size:24px}
  .tiles button{width:44px;height:50px;font-size:24px}
}
</style>

</head>
<body>
<div class="wrap" dir="rtl" lang="he">
  <header class="top">
    <div class="brand"><span class="en">English Quest</span><small>מסע באנגלית · כיתות ג׳–ד׳</small></div>
    <button class="chip" id="who" hidden aria-label="החלפת שחקן"><span class="av" id="whoAv"></span><span id="whoPts" class="en"></span></button>
  </header>
  <div class="notice" id="noVoice" hidden>הדפדפן הזה לא תומך בהקראה. כדאי לפתוח ב-Safari או Chrome.</div>
  <main id="screen"></main>
  <footer class="credit"><span class="en" style="display:inline-block">Made with ❤ by Yaron Y · © 2026<span id="voiceName" style="opacity:.6"></span><span style="opacity:.6"> · Quest v1</span></span></footer>
</div>

<script>
/* ---------- content (shared with English Fun) ---------- */
const LETTERS = [
 ["A","אֵיי","Apple","🍎","תפוח"],["B","בִּי","Ball","⚽","כדור"],["C","סִי","Cat","🐱","חתול"],
 ["D","דִי","Dog","🐶","כלב"],["E","אִי","Egg","🥚","ביצה"],["F","אֶף","Fish","🐟","דג"],
 ["G","ג'ִי","Grapes","🍇","ענבים"],["H","אֵייץ'","Hat","🎩","כובע"],["I","אַיי","Ice cream","🍦","גלידה"],
 ["J","ג'ֵיי","Juice","🧃","מיץ"],["K","קֵיי","Key","🔑","מפתח"],["L","אֶל","Lion","🦁","אריה"],
 ["M","אֶם","Moon","🌙","ירח"],["N","אֶן","Nose","👃","אף"],["O","אוֹ","Orange","🍊","תפוז"],
 ["P","פִּי","Pizza","🍕","פיצה"],["Q","קְיוּ","Queen","👸","מלכה"],["R","אַר","Rabbit","🐰","ארנב"],
 ["S","אֶס","Sun","☀️","שמש"],["T","טִי","Tree","🌳","עץ"],["U","יוּ","Umbrella","☂️","מטרייה"],
 ["V","וִי","Violin","🎻","כינור"],["W","דַאבֶּל יוּ","Watch","⌚","שעון"],["X","אֶקְס","Fox","🦊","שועל (האות x בסוף המילה)"],
 ["Y","וַאי","Yo-yo","🪀","יו-יו"],["Z","זִי","Zebra","🦓","זברה"]
];
const DAYS = [
 {en:"Sunday",he:"יום ראשון",say:"סַנְדֵיי",tip:"Sun = שמש. יום השמש",c:"var(--sun)"},
 {en:"Monday",he:"יום שני",say:"מַנְדֵיי",tip:"Mon נשמע כמו Moon = ירח",c:"var(--sky)"},
 {en:"Tuesday",he:"יום שלישי",say:"טְיוּזְדֵיי",tip:"Tue נשמע כמו two, אבל זה היום השלישי",c:"var(--grass)"},
 {en:"Wednesday",he:"יום רביעי",say:"וֶנְזְדֵיי",tip:"כותבים Wed-nes-day אבל לא אומרים את ה-d הראשונה",c:"var(--berry)"},
 {en:"Thursday",he:"יום חמישי",say:"ת'ֶרְזְדֵיי",tip:"Thor, אל הרעם. יום של ת'ור",c:"var(--tomato)"},
 {en:"Friday",he:"יום שישי",say:"פְרַיידֵיי",tip:"Fri נשמע כמו free = חופשי. סוף שבוע!",c:"var(--sky)"},
 {en:"Saturday",he:"שבת",say:"סֶטֶרְדֵיי",tip:"Saturn = שבתאי, כמו שבת!",c:"var(--grass)"}
];

const NUMS=[
 ["one","וָואן"],["two","טוּ"],["three","ת'ְרִי"],["four","פוֹר"],["five","פַייב"],
 ["six","סִיקְס"],["seven","סֶבֶן"],["eight","אֵייט"],["nine","נַיין"],["ten","טֶן"],
 ["eleven","אִילֶבֶן"],["twelve","טְוֶלְב"],["thirteen","ת'ֶרְטִין"],["fourteen","פוֹרְטִין"],["fifteen","פִיפְטִין"],
 ["sixteen","סִיקְסְטִין"],["seventeen","סֶבֶנְטִין"],["eighteen","אֵייטִין"],["nineteen","נַיינְטִין"],["twenty","טְוֶנְטִי"]
];
// [english, hebrew, say, swatch, emoji, object for sentence]
const COLORS=[
 ["red","אדום","רֶד","#E53935","🍓","The strawberry"],["orange","כתום","אוֹרֶנְג'","#FB8C00","🍊","The orange"],
 ["yellow","צהוב","יֶלוֹ","#FDD835","🍌","The banana"],["green","ירוק","גְרִין","#43A047","🐸","The frog"],
 ["blue","כחול","בְּלוּ","#1E88E5","🐳","The whale"],["purple","סגול","פֶּרְפֶּל","#8E24AA","🍇","The grapes are"],
 ["pink","ורוד","פִּינְק","#F06292","🌸","The flower"],["brown","חום","בְּרַאוּן","#795548","🐻","The bear"],
 ["black","שחור","בְּלֶק","#212121","🐈‍⬛","The cat"],["white","לבן","וַוייט","#FFFFFF","☁️","The cloud"],

// Score installed voices so the most natural female teacher voice wins on each device.
const VOICE_TOP=["Ava","Jenny","Aria","Emma","Michelle","Samantha","Allison","Susan","Zoe","Joelle","Google US English"];
const VOICE_MALE=/\b(Guy|Andrew|Brian|Christopher|Eric|Roger|Steffan|David|Mark|Alex|Fred|Tom|Aaron|Evan|Nathan|Ralph|Junior)\b/i;
const VOICE_NOVELTY=/Bells|Boing|Bubbles|Cellos|Bad News|Good News|Jester|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Albert|Bahh|Hysterical|Deranged|Pipe|Ana\b/i;
// Non-American accents, by region in the name and by Apple's British/Australian/Irish/Indian voice names.
const VOICE_NOT_US=/United Kingdom|\bUK\b|British|Australia|India|Ireland|Scotland|South Africa|New Zealand|Canada|\b(Daniel|Kate|Serena|Arthur|Martha|Stephanie|Oliver|Karen|Moira|Tessa|Rishi|Veena|Fiona|Lee|Catherine|Gordon|Sonia|Libby|Maisie|Ryan|Thomas|Natasha|William|Neerja|Prabhat)\b/i;
const isUS=v=>/^en[-_]US/i.test(v.lang)||/United States|US English/i.test(v.name);
function voiceScore(v){
  let s=0;const n=v.name;
  if(!/^en/i.test(v.lang))return -1e9;
  s+=isUS(v)?500:-400;                          // American accent only, others are a last resort
  if(VOICE_NOT_US.test(n))s-=400;
  if(/Natural|Neural/i.test(n))s+=200;          // Edge / Windows 11 neural voices
  if(/Online/i.test(n))s+=40;
  if(/Multilingual/i.test(n))s-=30;
  if(/Premium|Enhanced/i.test(n))s+=120;        // iOS / macOS downloaded voices
  if(/^Google/i.test(n))s+=90;                  // Chrome cloud voice
  const i=VOICE_TOP.findIndex(p=>n.includes(p));if(i>=0)s+=60-i*3;
  if(VOICE_MALE.test(n))s-=150;
  if(VOICE_NOVELTY.test(n))s-=1000;             // joke voices, and the child voice "Ana"
  return s;
}
function pickVoice(){
  if(!("speechSynthesis" in window))return;
  const vs=speechSynthesis.getVoices();
  if(!vs.length)return;
  voice=vs.slice().sort((a,b)=>voiceScore(b)-voiceScore(a))[0];
  if(voiceScore(voice)<-1e8)voice=null;
  const el=document.getElementById("voiceName");if(el)el.textContent=voice?" · Voice: "+voice.name:"";
}
if("speechSynthesis" in window){

 {w:4,t:"מה בא אחרי?",g:["dAfter","dHear"],k:4,time:20},
 {w:4,t:"שבוע שלם",g:["dSpell","dTr","dAfter"],k:4,time:15},
 {w:5,t:"מילים ראשונות",g:["wTr"],k:3},
 {w:5,t:"אוזן למילים",g:["wHear"],k:4},
 {w:5,t:"כתיב נכון",g:["wSpell"],k:4,time:20},
 {w:5,t:"בונים מילים",g:["wBuild"],k:0},
 {w:6,t:"משלימים משפט",g:["sFill"],k:3},
 {w:6,t:"שומעים ובונים",g:["wBuildHear","sFill","wSpell"],k:4,time:25},
 {w:6,t:"מבחן האלופים",g:ALL_CHOICE,k:6,time:12},
 {w:6,t:"הבוס הגדול",g:[...ALL_CHOICE,"wBuildHear"],k:6,time:10,n:10,boss:true}
];
const HEARTS=3,QN=8;
const qCount=L=>L.n||QN;
// Building a word takes longer than tapping an answer
const qTime=(L,q)=>L.time?(q.build?L.time+12:L.time):0;

function makeQuestions(li){
  const L=LEVELS[li],qs=[];let last=null;
  for(let i=0;i<qCount(L);i++){
    let q,tries=0;
    do{q=GEN[L.g[(i+rnd(L.g.length))%L.g.length]](L.k);tries++}while(q.answer===last&&tries<12);
    last=q.answer;qs.push(q);
  }
  return qs;
}

/* ---------- scoring ---------- */
// Per correct answer: 10 × world, plus up to 5 × world for speed on timed levels, plus 5 × world on a streak of 3+.
function scoreAnswer(w,timeFrac,streak){
  let p=10*w;
  if(timeFrac>0)p+=Math.round(5*w*Math.min(1,timeFrac));
  if(streak>=3)p+=5*w;
  return p;
}
// Finishing a level: 10 × world for every heart left. Stars = hearts left.
const finishBonus=(w,hearts)=>hearts>0?hearts*10*w:0;
const RANKS=[[0,"🐣","מתחיל","מתחילה"],[4,"🧭","חוקר","חוקרת"],[8,"🦸","גיבור","גיבורה"],[12,"🥇","אלוף","אלופה"],[16,"🎓","מאסטר","מאסטרית"],[20,"🧙","קוסם אנגלית","קוסמת אנגלית"],[24,"👑","אגדה","אגדה"]];
function rankOf(passed,g){let r=RANKS[0];for(const x of RANKS)if(passed>=x[0])r=x;return r[1]+" "+(g==="m"?r[2]:r[3])}

/* ---------- access code (paywall hook) ---------- */
// Levels 1-8 are free. Set PAYWALL=true to require a code for the rest. Open the page with #paywall to preview it.
let PAYWALL=false;
const FREE_LEVELS=8;
const SALT="yy-quest-2026";
function h32(s){let h=0x811c9dc5;for(const ch of s){h^=ch.codePointAt(0);h=Math.imul(h,0x01000193)>>>0}return h>>>0}
const CODE_ABC="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
function code4(n){let s="";for(let i=0;i<4;i++){s+=CODE_ABC[n&31];n>>>=5}return s}
function makeCode(id){id=String(id).toUpperCase();return`EQ-${id}-${code4(h32(id+SALT))}`}
function validCode(c){const m=String(c).trim().toUpperCase().replace(/\s+/g,"").match(/^EQ-?([A-Z0-9]{4})-?([A-Z0-9]{4})$/);return !!m&&code4(h32(m[1]+SALT))===m[2]}

/* ---------- storage ---------- */
const KEY="englishquest.v1";
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const S=Object.assign({profiles:[],cur:null,friends:[],license:null},load());
const me=()=>S.profiles.find(p=>p.id===S.cur)||null;
const tx=(f,m)=>me()&&me().g==="m"?m:f;
function passedCount(p){let n=0;while(n<LEVELS.length&&p.best[n]&&p.best[n].stars>0)n++;return n}
const totalPts=p=>Object.values(p.best).reduce((a,b)=>a+b.pts,0);
const totalStars=p=>Object.values(p.best).reduce((a,b)=>a+b.stars,0);
const unlocked=(p,i)=>i===0||!!(p.best[i-1]&&p.best[i-1].stars>0);
const paywalled=i=>PAYWALL&&i>=FREE_LEVELS&&!S.license;
function record(p,li,pts,stars){
  // Keep the best of each: replaying can raise a level's points and stars, never lower them
  const b=p.best[li]||{pts:0,stars:0};
  p.best[li]={pts:Math.max(pts,b.pts),stars:Math.max(stars,b.stars)};
  save();
}

/* ---------- share code for friends ---------- */
const b64e=s=>btoa(String.fromCharCode(...new TextEncoder().encode(s))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const b64d=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/-/g,"+").replace(/_/g,"/")),c=>c.charCodeAt(0)));
function encodeShare(p){
  const j=JSON.stringify([1,p.name,p.av,p.g,passedCount(p),totalPts(p),totalStars(p),Math.floor(Date.now()/1000)]);
  return "EQ:"+b64e(j)+"."+h32(j+SALT).toString(36).slice(-4);
}
function parseShare(text){
  const m=String(text).match(/EQ:([A-Za-z0-9_-]+)\.([a-z0-9]{1,4})/);
  if(!m)return null;
  try{
    const j=b64d(m[1]);if(h32(j+SALT).toString(36).slice(-4)!==m[2])return null;
    const a=JSON.parse(j);if(a[0]!==1)return null;
    const [,name,av,g,passed,pts,stars,ts]=a;
    if(typeof name!=="string"||!name.trim()||passed<0||passed>LEVELS.length||pts<0||stars<0||stars>LEVELS.length*3)return null;
    return {name:name.slice(0,14),av,g,passed,pts,stars,ts};
  }catch(e){return null}
}
function shareText(p){
  const n=passedCount(p);
  return `🏆 ${p.name} ${p.g==="m"?"עבר":"עברה"} ${n} שלבים ב-English Quest וצבר${p.g==="m"?"":"ה"} ${totalPts(p)} נקודות! מי ${p.g==="m"?"מנצח":"מנצחת"}?\nהקוד שלי לטבלת האלופים: ${encodeShare(p)}`;
}
function addFriend(f){
  if(S.profiles.some(p=>p.name===f.name&&p.av===f.av))return "self";
  const i=S.friends.findIndex(x=>x.name===f.name&&x.av===f.av);
  if(i>=0){if(f.ts<S.friends[i].ts)return "old";S.friends[i]=f}else S.friends.push(f);
  save();return "ok";
}
// Rank by levels passed, then points, then stars
function sortBoard(rows){return rows.slice().sort((a,b)=>b.passed-a.passed||b.pts-a.pts||b.stars-a.stars||a.name.localeCompare(b.name))}
function boardRows(){
  return sortBoard([...S.profiles.map(p=>({name:p.name,av:p.av,g:p.g,passed:passedCount(p),pts:totalPts(p),stars:totalStars(p),local:true,id:p.id})),
    ...S.friends.map((f,i)=>({...f,friend:i}))]);
}

function starStr(n,max=3){return "★".repeat(n)+(n<max?`<span class="off">${"★".repeat(max-n)}</span>`:"")}
function showMap(){

          <span class="ball">${pw?"🔑":op?(L.boss?"👑":i+1):"🔒"}${L.time&&op&&!pw?`<span class="pro">⏱</span>`:""}</span>
          <span class="stars">${b?starStr(b.stars):""}</span><span class="t">${L.t}</span></button>`}).join("")}</div></section>`;
  }).join("");
  screen.innerHTML=`
    <div class="card hero">

      <div class="stats">
        <div class="stat"><b class="en">${Math.min(passed+1,LEVELS.length)}<small style="font-size:14px;color:var(--muted)">/${LEVELS.length}</small></b><span>שלב</span></div>
        <div class="stat"><b class="en">${totalPts(p).toLocaleString("en-US")}</b><span>💎 נקודות</span></div>
        <div class="stat"><b class="en">${totalStars(p)}</b><span>★ כוכבים</span></div>
      </div>
    </div>
    <div class="actions">
      <button class="btn big warm" id="cont">▶ ${passed>=LEVELS.length?"עברת הכול! שחקו שוב":"לשלב "+(passed+1)}</button>
      <button class="btn alt" id="toBoard">🏆 טבלת אלופים</button>
      <button class="btn ghost" id="toProfiles">👥 החלפת שחקן</button>

    ${PAYWALL&&!S.license?`<p class="muted" style="margin-top:-8px">שלבים 1–${FREE_LEVELS} פתוחים בחינם. 🔑 = נפתח עם קוד גישה.</p>`:""}
    ${worlds}`;

function tryLevel(li){
  const p=me();
  if(paywalled(li))return showPaywall(li);
  if(!unlocked(p,li)){speak("Locked!");const n=screen.querySelector(`.node[data-li="${li}"] .ball`);if(n){n.style.animation="shake .35s";setTimeout(()=>n.style.animation="",400)}return}
  go(startLevel,li);
}

/* ---------- playing a level ---------- */
let R=null;
const PRAISE=["Great job!","Excellent!","Well done!","Super!","Amazing!","Awesome!"];
function startLevel(li){
  R={li,L:LEVELS[li],qs:makeQuestions(li),n:0,hearts:HEARTS,pts:0,streak:0,best:0,res:[],locked:false};
  renderQ();
}
function heartsStr(){return "❤️".repeat(R.hearts)+"🤍".repeat(HEARTS-R.hearts)}
function renderQ(){
  const q=R.qs[R.n],L=R.L,W=WORLDS[L.w-1],qn=qCount(L);
  const dots=Array.from({length:qn},(_,i)=>`<i class="${R.res[i]===true?"ok":R.res[i]===false?"no":i===R.n?"now":""}"></i>`).join("");
  const opts=q.build?`<div class="slots" id="slots">${q.answer.split("").map((_,i)=>`<button data-s="${i}" aria-label="מקום ${i+1}"></button>`).join("")}</div>
      <div class="tiles" id="tiles">${q.build.map((c,i)=>`<button data-t="${i}">${c}</button>`).join("")}</div>`
    :`<div class="opts n${q.opts.length}">${q.opts.map((o,i)=>q.sw?`<button class="opt sw" data-i="${i}" aria-label="${o}" style="--sw:${swatchOf(o)}"></button>`:`<button class="opt${q.he?" he":""}" data-i="${i}">${esc(o)}</button>`).join("")}</div>`;
  screen.innerHTML=`<div class="play">
    <div class="phead"><button class="x" id="quit" aria-label="חזרה למפה">✕</button>
      <span class="lt">${W.e} שלב ${R.li+1} · ${L.t}</span>
      <span class="hearts" aria-label="${R.hearts} לבבות">${heartsStr()}</span><span class="pts en" id="pts">${R.pts}</span></div>
    <div class="dots">${dots}</div>
    ${qTime(L,q)?`<div class="timer"><i id="tbar"></i></div>`:""}
    <div class="prompt">
      <div class="q">${q.text}</div>
      ${q.pic?`<div class="pic">${q.pic}</div>`:""}
      ${q.hint?`<div class="hint">${esc(q.hint)}</div>`:""}
      ${q.big?`<div class="bigq">${esc(q.big)}</div>`:""}
      ${q.sent?`<div class="sent">${esc(q.sent).replace("___","<u>&nbsp;</u>")}</div>`:""}
      ${q.say?`<button class="say" id="qSay">🔊 שוב</button>`:""}
    </div>
    ${opts}
    <div class="feedback" id="fb" aria-live="polite">${R.streak>=3?`🔥 רצף של ${R.streak}!`:""}</div>
    <div class="foot"><button class="btn" id="nextQ" hidden>הבא ←</button></div>
  </div>`;
  R.locked=false;
  $("quit").onclick=()=>go(showMap);
  if(q.say){$("qSay").onclick=()=>speak(q.say);setTimeout(()=>{if(R&&R.qs[R.n]===q)speak(q.say)},250)}
  if(q.build)wireBuild(q);
  else screen.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(q.opts[+b.dataset.i],b));
  $("nextQ").onclick=next;
  const T=qTime(L,q);
  if(T){
    // Listening questions get a short grace period while the word is spoken
    const t0=Date.now()+(q.say?1200:0),bar=$("tbar");
    R.deadline=t0+T*1000;R.T=T;
    timerId=setInterval(()=>{
      const left=Math.max(0,R.deadline-Date.now()),frac=Math.min(1,left/(T*1000));
      bar.style.transform=`scaleX(${frac})`;bar.classList.toggle("low",frac<.3);
      if(left<=0){stopTimer();answer(null,null,true)}
    },100);
  }
}
function wireBuild(q){
  const picked=[];
  const slots=[...$("slots").children],tiles=[...$("tiles").children];
  const paint=()=>slots.forEach((s,i)=>{s.textContent=picked[i]!=null?q.build[picked[i]]:"";s.classList.toggle("full",picked[i]!=null)});
  tiles.forEach(t=>t.onclick=()=>{
    if(R.locked||picked.length>=slots.length)return;
    picked.push(+t.dataset.t);t.disabled=true;paint();
    if(picked.length===slots.length)answer(picked.map(i=>q.build[i]).join(""));
  });
  slots.forEach(s=>s.onclick=()=>{
    if(R.locked||!picked.length)return;
    tiles[picked.pop()].disabled=false;paint();
  });
}
function answer(val,btn,timeout){
  if(R.locked)return;R.locked=true;
  const q=R.qs[R.n],L=R.L,ok=!timeout&&val===q.answer;
  let frac=0;
  if(qTime(L,q)){frac=Math.max(0,(R.deadline-Date.now())/(R.T*1000));stopTimer()}
  screen.querySelectorAll(".opt").forEach((b,i)=>{b.disabled=true;if(q.opts[i]===q.answer)b.classList.add("right")});
  if(btn&&!ok)btn.classList.add("wrong");
  if(q.build){$("slots").classList.add(ok?"right":"wrong");screen.querySelectorAll(".tiles button").forEach(t=>t.disabled=true)}
  R.res[R.n]=ok;
  const fb=$("fb");
  if(ok){
    R.streak++;R.best=Math.max(R.best,R.streak);
    const gain=scoreAnswer(L.w,frac,R.streak);R.pts+=gain;$("pts").textContent=R.pts;
    const p=PRAISE[rnd(PRAISE.length)];
    fb.className="feedback ok";fb.innerHTML=`<span class="en">${p}</span> +${gain}${R.streak>=3?` 🔥${R.streak}`:""}`;
    speak(q.sayAfter||p,0.9);
    setTimeout(()=>{if(R&&R.qs[R.n]===q)next()},q.sayAfter&&q.sayAfter.length>12?1900:1200);
  }else{
    R.streak=0;R.hearts--;
    screen.querySelector(".hearts").textContent=heartsStr();
    fb.className="feedback no";
    fb.innerHTML=`${timeout?"נגמר הזמן! ":"כמעט! "}התשובה: <span class="${q.he?"":"en"}">${esc(q.answer)}</span>`;
    if(!q.he)speak(q.sayAfter||(q.answer.length===1?letterSpeech(q.answer.toUpperCase()):q.answer));
    const nb=$("nextQ");nb.hidden=false;nb.textContent=R.hearts<=0?"לתוצאה ←":"הבא ←";nb.focus();
  }
}
function next(){
  if(!R)return;
  if(R.hearts<=0||R.n>=qCount(R.L)-1)return finish();
  R.n++;renderQ();
}
function finish(){
  stopTimer();
  const p=me(),li=R.li,L=R.L,won=R.hearts>0;
  const bonus=finishBonus(L.w,R.hearts),total=won?R.pts+bonus:0,stars=won?R.hearts:0;
  const before=passedCount(p),prev=p.best[li];
  if(won)record(p,li,total,stars);
  const after=passedCount(p),isBest=won&&(!prev||total>prev.pts);
  const right=R.res.filter(x=>x).length;
  updateChip();
  let news="";
  if(won&&after>before&&after<LEVELS.length)news=`🔓 נפתח שלב ${after+1}: ${LEVELS[after].t}`;
  if(won&&after>before&&LEVELS[after]&&LEVELS[after].w!==L.w)news=`🗺️ עולם חדש נפתח: ${WORLDS[LEVELS[after].w-1].name}!`;
  if(won&&after===LEVELS.length&&before<LEVELS.length)news="👑 סיימת את כל המסע! את/ה אגדה!";
  const nextOk=won&&li+1<LEVELS.length;
  screen.innerHTML=`<div class="play result">
    <h2>${won?(stars===3?"מושלם!":"עברת את השלב!"):"נגמרו הלבבות"}</h2>
    <div class="bigst">${starStr(stars)}</div>
    ${won?`<div class="gain en">+${total}</div><span class="muted">💎 נקודות${isBest&&prev?" · שיא חדש!":""}</span>`:`<p style="margin:0">${tx("לא נורא! כל ניסיון מלמד. נסי שוב, את יכולה!","לא נורא! כל ניסיון מלמד. נסה שוב, אתה יכול!")}</p>`}
    <table><tr><td>תשובות נכונות</td><td class="en">${right}/${R.res.length}</td></tr>
      <tr><td>רצף הכי ארוך</td><td class="en">${R.best}</td></tr>
      ${won?`<tr><td>בונוס לבבות</td><td class="en">+${bonus}</td></tr>`:""}</table>
    ${news?`<div class="news">${news}</div>`:""}
    <div class="row">
      ${nextOk?`<button class="btn big warm" id="nextL">לשלב ${li+2} ▶</button>`:""}
      <button class="btn${won?" ghost":" big warm"}" id="again">${tx("שחקי שוב","שחק שוב")}</button>
      <button class="btn ghost" id="toMap">למפה</button>
    </div></div>`;
  if(nextOk)$("nextL").onclick=()=>tryLevel(li+1);
  $("again").onclick=()=>go(startLevel,li);
  $("toMap").onclick=()=>go(showMap);
  speak(won?(stars===3?"Perfect! Three stars!":"Level complete!"):"Good try! Let's try again.",0.9);
  if(won&&stars===3)confetti();
  R=null;
}
function confetti(){
  const c=document.createElement("div");c.className="confetti";
  c.innerHTML=Array.from({length:22},()=>`<i style="left:${rnd(96)}%;animation-delay:${rnd(600)}ms">${["⭐","🎉","💎","✨"][rnd(4)]}</i>`).join("");
  document.body.appendChild(c);setTimeout(()=>c.remove(),2600);
}

/* ---------- leaderboard ---------- */
function showBoard(){
  const p=me();updateChip();
  const rows=boardRows();
  const medal=i=>["🥇","🥈","🥉"][i]||i+1;
  const txt=p?shareText(p):"";
  screen.innerHTML=`
    <h2>🏆 טבלת אלופים</h2>
    <p class="muted" style="margin-top:-6px">מדרגים לפי השלב הכי גבוה, ואחר כך לפי נקודות.</p>
    <div class="board">${rows.map((r,i)=>`<div class="brow${p&&r.id===p.id?" me":""}">
      <span class="pl">${medal(i)}</span><span class="av">${r.av}</span>
      <span class="nm"><b>${esc(r.name)}</b><small>${r.local?"במכשיר הזה":"חבר/ה"} · ${r.pts.toLocaleString("en-US")} 💎 · ★${r.stars}</small></span>
      <span class="lv"><b>${Math.min(r.passed+1,LEVELS.length)}</b><small>שלב</small></span>
      ${r.friend!=null?`<button class="del" data-f="${r.friend}" aria-label="הסרה">✕</button>`:"<span></span>"}</div>`).join("")}</div>
    ${p?`<div class="card form" style="margin-bottom:14px">
      <h3>📤 שולחים את ההישג לחברים</h3>
      <p class="muted" style="margin:0">החברים מדביקים את ההודעה אצלם, ואתם מופיעים בטבלה שלהם.</p>
      <div class="codebox" id="myCode">${esc(txt)}</div>
      <div class="row"><button class="btn" id="copy">העתקה</button>
        <a class="btn alt" style="text-decoration:none" id="wa" href="https://wa.me/?text=${encodeURIComponent(txt)}" target="_blank" rel="noopener">שליחה בוואטסאפ</a></div>
      <div class="msg ok" id="copyMsg"></div></div>`:""}
    <form class="card form" id="addF">
      <h3>➕ מוסיפים חבר/ה לטבלה</h3>
      <label for="fCode">מדביקים כאן את ההודעה שקיבלתם</label>
      <textarea id="fCode" placeholder="🏆 ... הקוד שלי לטבלת האלופים: EQ:..."></textarea>
      <div class="msg" id="fMsg"></div>
      <button class="btn" type="submit">הוספה לטבלה</button></form>
    <div class="row" style="margin-top:16px"><button class="btn ghost" id="toMap">→ חזרה למפה</button></div>`;
  screen.querySelectorAll(".del").forEach(b=>b.onclick=()=>{S.friends.splice(+b.dataset.f,1);save();showBoard()});
  $("toMap").onclick=()=>go(p?showMap:showProfiles);
  if(p)$("copy").onclick=()=>{
    const ok=()=>$("copyMsg").textContent="הועתק! אפשר להדביק בוואטסאפ.";
    try{navigator.clipboard.writeText(txt).then(ok,()=>selectCode())}catch(e){selectCode()}
  };
  $("addF").onsubmit=e=>{
    e.preventDefault();const f=parseShare($("fCode").value),m=$("fMsg");
    if(!f){m.className="msg no";m.textContent="לא מצאתי קוד תקין. צריך להדביק את כל ההודעה, כולל EQ:...";return}
    const r=addFriend(f);
    if(r==="self"){m.className="msg no";m.textContent="זה שחקן שכבר נמצא במכשיר הזה.";return}
    m.className="msg ok";m.textContent=r==="old"?"יש כבר תוצאה חדשה יותר של "+f.name:f.name+" נוסף/ה לטבלה!";
    if(r==="ok")setTimeout(showBoard,900);
  };
}
function selectCode(){const r=document.createRange();r.selectNodeContents($("myCode"));const s=getSelection();s.removeAllRanges();s.addRange(r);$("copyMsg").textContent="סמנו והעתיקו את הטקסט."}

/* ---------- paywall sheet ---------- */
function closeSheet(){const s=$("sheet");if(s)s.remove()}
function showPaywall(li){
  closeSheet();
  const d=document.createElement("div");d.className="sheet";d.id="sheet";
  d.innerHTML=`<form class="card" id="payF" role="dialog" aria-label="פתיחת המסע המלא">
    <h2 style="margin:0">🔑 פותחים את המסע המלא</h2>
    <p style="margin:0">שלבים 1–${FREE_LEVELS} חינם. כדי להמשיך לשלב ${li+1} ולכל ${LEVELS.length} השלבים צריך קוד גישה.</p>
    <ul><li>4 עולמות נוספים: צבעים, ימים, מילים ומשפטים</li><li>מבחן האלופים והבוס הגדול</li><li>כל הילדים במכשיר, תשלום חד-פעמי</li></ul>
    <label for="acc">קוד גישה</label><input type="text" id="acc" class="en" placeholder="EQ-XXXX-XXXX" autocomplete="off" autocapitalize="characters">
    <div class="msg" id="accMsg"></div>
    <div class="row"><button class="btn" type="submit">פתיחה</button><button class="btn ghost" type="button" id="accX">אחר כך</button></div></form>`;
  document.body.appendChild(d);
  d.onclick=e=>{if(e.target===d)closeSheet()};
  $("accX").onclick=closeSheet;
  $("payF").onsubmit=e=>{
    e.preventDefault();const c=$("acc").value;
    if(!validCode(c)){$("accMsg").className="msg no";$("accMsg").textContent="הקוד לא תקין. בדקו שהוקלד בדיוק כמו שקיבלתם.";return}
    S.license=c.trim().toUpperCase();save();$("accMsg").className="msg ok";$("accMsg").textContent="המסע המלא נפתח! 🎉";
    setTimeout(()=>{closeSheet();showMap()},900);
  };
}

/* ---------- boot ---------- */
$("who").onclick=()=>go(showProfiles);
try{if(location.hash==="#paywall")PAYWALL=true}catch(e){}
go(me()?showMap:showProfiles);
window.EQ={LEVELS,WORLDS,GEN,SENTENCES,makeQuestions,scoreAnswer,finishBonus,makeCode,validCode,encodeShare,parseShare,sortBoard,passedCount,totalPts,unlocked,misspell,S,get R(){return R},setPaywall:v=>{PAYWALL=v}};
</script>

</body>
</html>
